<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#ffffff">
    <title>Clean HTML Viewer</title>
    <style>
        * { box-sizing: border-box; }
        html, body { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            background: #ffffff; 
        }
        
        #app-container {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
        }

        #controls { 
            padding: 12px 16px;
            background: #2c2c2e; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border-bottom: 1px solid #3a3a3c; 
            flex-shrink: 0;
        }
        
        .btn { 
            padding: 8px 16px; 
            background: #0a84ff; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-weight: 600; 
            font-size: 14px; 
            cursor: pointer; 
        }
        
        #file-input { display: none; }
        
        #viewer-frame { 
            flex: 1;
            width: 100%;
            border: none; 
            background: #ffffff; 
        }
        
        #secret-trigger {
            display: none;
            position: fixed;
            top: 0;
            right: 0;
            width: 80px;
            height: 80px;
            background: transparent;
            z-index: 99999;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="app-container">
        <div id="controls">
            <label for="file-input" class="btn">Open HTML File</label>
            <input type="file" id="file-input" accept=".html,.htm">
        </div>

        <iframe id="viewer-frame"></iframe>
    </div>

    <div id="secret-trigger" onclick="toggleHeader(true)"></div>

    <script>
        function toggleHeader(show) {
            const controls = document.getElementById('controls');
            const trigger = document.getElementById('secret-trigger');
            if (show) {
                controls.style.display = 'flex';
                trigger.style.display = 'none';
            } else {
                controls.style.display = 'none';
                trigger.style.display = 'block';
            }
        }

        document.getElementById('file-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const blob = new Blob([evt.target.result], { type: 'text/html' });
                    document.getElementById('viewer-frame').src = URL.createObjectURL(blob);
                    toggleHeader(false); 
                };
                reader.readAsText(file);
            }
        });
    </script>
</body>
</html>
